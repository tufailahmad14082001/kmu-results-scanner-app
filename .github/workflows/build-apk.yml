name: Build APK

# Builds the installable Android app (debug APK) for the KMU Results Scanner.
# Runs on every push to main and can also be started by hand.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Give the APK a clear name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/KMU-Results-Scanner.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KMU-Results-Scanner-APK
          path: app/build/outputs/apk/debug/KMU-Results-Scanner.apk

      - name: Publish it on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KMU Results Scanner — latest APK
          body: |
            Installable Android app for the KMU Results Scanner.
            Tap the APK file below to download it, then open it and tap Install.
            If the phone asks, allow "Install unknown apps" for your browser.
          files: app/build/outputs/apk/debug/KMU-Results-Scanner.apk
