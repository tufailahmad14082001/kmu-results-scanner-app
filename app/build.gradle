plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tufail.kmu.scanner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tufail.kmu.scanner'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Always compile as UTF-8, whatever the machine's default charset is.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

dependencies {
    // FIX 2026-11-16b: WebViewAssetLoader (serves the app's own files over
    // a real https origin, so the bundled photo reader works fully offline).
    implementation 'androidx.webkit:webkit:1.8.0'
}
